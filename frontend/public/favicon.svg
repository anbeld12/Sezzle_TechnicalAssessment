<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Calculator Chassis / Body -->
  <rect x="32" y="24" width="448" height="464" rx="88" fill="#1E46C9" />
  
  <!-- Subtle Body Inner Shadow / Highlight -->
  <rect x="36" y="28" width="440" height="456" rx="84" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- LCD Screen Display -->
  <rect x="76" y="68" width="360" height="104" rx="24" fill="#15C7B7" />
  <rect x="76" y="68" width="360" height="104" rx="24" stroke="rgba(0,0,0,0.1)" stroke-width="2" />
  
  <!-- LCD Display Numbers (e.g. 12+8= or 128) -->
  <!-- Subtle screen digits in teal dark contrast -->
  <text x="410" y="142" font-family="system-ui, -apple-system, 'SF Pro Display', Roboto, sans-serif" font-size="56" font-weight="700" fill="#0C4B44" text-anchor="end" letter-spacing="2">128</text>

  <!-- Button Grid Definition (4 columns x 3 rows) -->
  <!-- Row 1 (y=200): C (Yellow), / (Orange), * (Yellow), - (Yellow) -->
  <rect x="76" y="200" width="76" height="72" rx="20" fill="#FBCB05" />
  <text x="114" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E46C9" text-anchor="middle">C</text>

  <rect x="170" y="200" width="76" height="72" rx="20" fill="#FF6616" />
  <text x="208" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">÷</text>

  <rect x="264" y="200" width="76" height="72" rx="20" fill="#FBCB05" />
  <text x="302" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#1E46C9" text-anchor="middle">×</text>

  <rect x="358" y="200" width="78" height="72" rx="20" fill="#FBCB05" />
  <text x="397" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#1E46C9" text-anchor="middle">−</text>

  <!-- Row 2 (y=292): 7 (White), 8 (Yellow), 9 (Orange), + (Orange) -->
  <rect x="76" y="292" width="76" height="72" rx="20" fill="#FFFFFF" />
  <text x="114" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E46C9" text-anchor="middle">7</text>

  <rect x="170" y="292" width="76" height="72" rx="20" fill="#FBCB05" />
  <text x="208" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E46C9" text-anchor="middle">8</text>

  <rect x="264" y="292" width="76" height="72" rx="20" fill="#FF6616" />
  <text x="302" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>

  <rect x="358" y="292" width="78" height="72" rx="20" fill="#FF6616" />
  <text x="397" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>

  <!-- Row 3 (y=384): 0 (Yellow), . (White), = (White), = (Orange wide or single) -->
  <rect x="76" y="384" width="76" height="72" rx="20" fill="#FBCB05" />
  <text x="114" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E46C9" text-anchor="middle">0</text>

  <rect x="170" y="384" width="76" height="72" rx="20" fill="#FFFFFF" />
  <text x="208" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#1E46C9" text-anchor="middle">.</text>

  <rect x="264" y="384" width="76" height="72" rx="20" fill="#FFFFFF" />
  <text x="302" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1E46C9" text-anchor="middle">±</text>

  <rect x="358" y="384" width="78" height="72" rx="20" fill="#FF6616" />
  <text x="397" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">=</text>
</svg>
