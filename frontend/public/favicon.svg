<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <!-- Calculator Chassis / Body -->
  <rect x="12" y="8" width="168" height="176" rx="38" fill="#1E46C9" />
  
  <!-- Subtle Body Inner Highlight -->
  <rect x="13.5" y="9.5" width="165" height="173" rx="36.5" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- LCD Screen Display -->
  <rect x="29" y="24" width="134" height="40" rx="9" fill="#15C7B7" />
  <rect x="29.5" y="24.5" width="133" height="39" rx="8.5" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1" />
  
  <!-- LCD Display Numbers (Right-aligned 128) -->
  <text x="154" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#0C4B44" text-anchor="end" letter-spacing="1">128</text>

  <!-- Button Grid Definition (4 columns x 3 rows) -->
  <!-- Row 1 (y=72): C (Yellow), ÷ (Orange), × (Yellow), − (Yellow) -->
  <rect x="29" y="72" width="29" height="27" rx="7.5" fill="#FBCB05" />
  <text x="43.5" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E46C9" text-anchor="middle">C</text>

  <rect x="64" y="72" width="29" height="27" rx="7.5" fill="#FF6616" />
  <text x="78.5" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">÷</text>

  <rect x="99" y="72" width="29" height="27" rx="7.5" fill="#FBCB05" />
  <text x="113.5" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1E46C9" text-anchor="middle">×</text>

  <rect x="134" y="72" width="29" height="27" rx="7.5" fill="#FBCB05" />
  <text x="148.5" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E46C9" text-anchor="middle">−</text>

  <!-- Row 2 (y=106): 7 (White), 8 (Yellow), 9 (Orange), + (Orange) -->
  <rect x="29" y="106" width="29" height="27" rx="7.5" fill="#FFFFFF" />
  <text x="43.5" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E46C9" text-anchor="middle">7</text>

  <rect x="64" y="106" width="29" height="27" rx="7.5" fill="#FBCB05" />
  <text x="78.5" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E46C9" text-anchor="middle">8</text>

  <rect x="99" y="106" width="29" height="27" rx="7.5" fill="#FF6616" />
  <text x="113.5" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text>

  <rect x="134" y="106" width="29" height="27" rx="7.5" fill="#FF6616" />
  <text x="148.5" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">+</text>

  <!-- Row 3 (y=140): 0 (Yellow), . (White), ± (White), = (Orange) -->
  <rect x="29" y="140" width="29" height="27" rx="7.5" fill="#FBCB05" />
  <text x="43.5" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E46C9" text-anchor="middle">0</text>

  <rect x="64" y="140" width="29" height="27" rx="7.5" fill="#FFFFFF" />
  <text x="78.5" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#1E46C9" text-anchor="middle">.</text>

  <rect x="99" y="140" width="29" height="27" rx="7.5" fill="#FFFFFF" />
  <text x="113.5" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1E46C9" text-anchor="middle">±</text>

  <rect x="134" y="140" width="29" height="27" rx="7.5" fill="#FF6616" />
  <text x="148.5" y="159" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">=</text>
</svg>
